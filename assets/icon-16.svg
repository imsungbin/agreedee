<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>Agreedee</title>
  <!--
    Redrawn on the 16px grid rather than scaled from the master: at this size
    the master's proportions blur the dash into a smear, and the dash is the
    whole point of the mark.
  -->
  <rect width="16" height="16" rx="3.5" fill="#111111"/>
  <rect x="2.5" y="2.5" width="11" height="11" rx="2.75" fill="#3fb950"/>
  <rect x="5" y="7" width="6" height="2" rx="1" fill="#ffffff"/>
</svg>
