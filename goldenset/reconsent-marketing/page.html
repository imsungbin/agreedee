<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>서비스</title></head>
<body>
<div id="root"><h1>서비스 홈</h1><p>오늘의 추천 목록</p></div>
<div class="overlay" aria-modal="true" role="dialog">
  <h2>수신 동의 재동의 안내</h2>
  <p>이전에 받으신 동의의 유효기간이 지나 재동의가 필요합니다. 동의하고 계속하기를 눌러주세요.</p>
  <div class="all"><label><input type="checkbox" id="ra" checked> 전체 동의</label></div>
  <ul>
    <li><label><input type="checkbox" checked> 광고성 정보 수신 동의</label><span>선택</span>
      <p>할인 소식과 신규 기능 안내를 이메일로 보내드립니다. 동의하지 않아도 서비스 이용에는 제한이 없습니다.</p></li>
    <li><label><input type="checkbox" checked> 야간 광고 수신 동의</label><span>선택</span>
      <p>오후 9시부터 오전 8시 사이에도 광고성 정보를 보내드립니다. 별도 동의가 없으면 야간에는 발송하지 않습니다.</p></li>
    <li><label><input type="checkbox" checked> 개인정보 제3자 제공 동의</label><span>선택</span>
      <p>제휴 광고주에게 회원의 연락처를 제공하여 맞춤 광고에 활용합니다. 거부하셔도 불이익은 없습니다.</p></li>
  </ul>
  <button type="button">동의하고 계속하기</button>
</div>
</body></html>
