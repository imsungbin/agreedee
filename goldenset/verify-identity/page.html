<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>본인확인</title></head>
<body>
<div class="cert">
  <h1>휴대폰 본인확인</h1>
  <p>통신사를 선택하고 실명확인을 진행합니다.</p>
  <form>
    <div class="all"><label><input type="checkbox" id="va"> 전체 동의</label></div>
    <ul class="terms">
      <li><label><input type="checkbox"> 본인확인 서비스 이용약관 (필수)</label>
        <p>본인확인기관이 제공하는 본인확인 서비스의 이용 조건을 정합니다. 본인확인을 진행하려면 동의가 필요합니다.</p></li>
      <li><label><input type="checkbox"> 개인정보 수집·이용 동의 (필수)</label>
        <p>이름, 생년월일, 성별, 휴대전화번호를 본인확인 목적으로 수집합니다. 확인 완료 후 즉시 파기합니다.</p></li>
      <li><label><input type="checkbox"> 고유식별정보 처리 동의 (필수)</label>
        <p>본인확인을 위하여 내국인 여부 및 연계정보를 처리합니다. 본 처리에 동의하지 않으면 인증을 진행할 수 없습니다.</p></li>
      <li><label><input type="checkbox"> 통신사 이용약관 (필수)</label>
        <p>이동통신사가 본인확인을 위해 가입자 정보를 조회하는 데 필요한 약관입니다. 동의 없이는 인증번호를 발송할 수 없습니다.</p></li>
    </ul>
    <button type="button">인증번호 받기</button>
  </form>
</div>
</body></html>
