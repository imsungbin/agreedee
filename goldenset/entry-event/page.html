<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>이벤트 응모</title></head>
<body>
<div class="event">
  <h1>여름 이벤트 응모하기</h1>
  <p>응모하신 분들 중 추첨을 통해 경품을 드립니다.</p>
  <form class="entry">
    <div class="row">이름 <input type="text"></div>
    <div class="row">휴대전화번호 <input type="tel"></div>
    <div class="agree">
      <div class="a-item">
        <label><input type="checkbox" id="e1"> 이벤트 응모 약관 동의 (필수)</label>
        <div class="t">응모자 확인과 경품 발송을 위하여 이름과 연락처를 수집합니다. 응모하시려면 본 항목에 동의하셔야 합니다.</div>
      </div>
      <div class="a-item">
        <label><input type="checkbox" id="e2" checked> 제휴사 개인정보 제공 동의 (선택)</label>
        <div class="t">회사는 제휴 광고주에게 응모자의 이름과 휴대전화번호를 제공하여 상품 안내에 사용하도록 합니다. 제공에 동의하지 않아도 응모가 가능합니다.</div>
      </div>
      <div class="a-item">
        <label><input type="checkbox" id="e3" checked> 광고성 정보 수신 동의 (선택)</label>
        <div class="t">앞으로 진행되는 행사와 할인 정보를 문자와 이메일로 보내드립니다. 수신 거부는 언제든지 가능합니다.</div>
      </div>
    </div>
    <button type="button">응모하기</button>
  </form>
</div>
</body></html>
