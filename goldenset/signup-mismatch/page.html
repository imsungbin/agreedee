<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>회원가입</title></head>
<body>
<form id="reg">
  <h1>회원가입</h1>
  <div class="row">아이디<input type="text"></div>
  <div class="row">비밀번호 확인<input type="password"></div>
  <div class="terms">
    <div class="terms__item">
      <label for="k1"><input type="checkbox" id="k1"> 서비스 이용약관 동의 (필수)</label>
      <div class="terms__body">본 약관은 회원과 회사 간 서비스 이용 계약의 내용을 정합니다. 회원 가입을 완료하려면 본 약관에 동의해야 합니다.</div>
    </div>
    <div class="terms__item">
      <label for="k2"><input type="checkbox" id="k2"> 맞춤형 광고 및 제휴 마케팅 활용 동의 (필수)</label>
      <div class="terms__body">회사는 회원의 구매 이력과 접속 기록을 분석하여 제휴사의 맞춤형 광고를 노출하고, 광고 대행사에 해당 정보를 제공합니다. 본 동의는 광고 및 마케팅 목적에만 사용됩니다.</div>
    </div>
    <div class="terms__item">
      <label for="k3"><input type="checkbox" id="k3" checked> 뉴스레터 수신 동의 (선택)</label>
      <div class="terms__body">회사가 발행하는 주간 뉴스레터를 이메일로 보내드립니다. 수신 거부는 언제든지 가능합니다.</div>
    </div>
  </div>
  <button type="submit">가입하기</button>
</form>
</body></html>
