<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>간편로그인 연동</title></head>
<body>
<div class="oauth">
  <h1>간편로그인으로 계속하기</h1>
  <p>계정 연동을 위해 아래 정보 제공에 동의해 주세요.</p>
  <form>
    <div class="scope">
      <label><input type="checkbox" id="s1"> 필수 제공 항목 동의</label>
      <div class="d">닉네임과 이메일 주소가 서비스에 전달됩니다. 이 항목은 계정 연동에 반드시 필요합니다.</div>
    </div>
    <div class="scope">
      <label><input type="checkbox" id="s2" checked> 선택 제공 항목 동의</label>
      <div class="d">성별과 연령대 정보가 함께 전달되어 맞춤 광고에 활용됩니다. 제공하지 않아도 연동은 완료됩니다.</div>
    </div>
    <button type="button">동의하고 계속하기</button>
  </form>
</div>
</body></html>
