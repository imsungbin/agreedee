<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>마이페이지</title></head>
<body>
<div class="page">
  <header><h1>마이페이지</h1></header>
  <p>최근 이용 내역이 없습니다.</p>
</div>
<div class="dim"></div>
<div class="modal" role="dialog" aria-labelledby="mt">
  <h2 id="mt">약관 개정 안내</h2>
  <p>서비스 약관이 개정되어 재동의가 필요합니다. 아래 항목을 확인하신 뒤 동의하고 계속하기를 눌러주세요.</p>
  <div class="modal__body">
    <div class="m-item">
      <label><input type="checkbox" id="m1"> 개정 이용약관 동의 (필수)</label>
      <div class="m-text">개정된 약관에는 서비스 중단 사유와 환불 절차가 추가되었습니다. 계속 이용하시려면 개정 약관에 동의하셔야 합니다.</div>
    </div>
    <div class="m-item">
      <label><input type="checkbox" id="m2" checked> 개인정보 마케팅 활용 동의 (선택)</label>
      <div class="m-text">회원의 서비스 이용 기록을 분석하여 맞춤형 광고를 노출하고 제휴사 프로모션을 안내합니다. 동의하지 않아도 서비스는 그대로 이용하실 수 있습니다.</div>
    </div>
  </div>
  <button type="button" class="ok">동의하고 계속하기</button>
</div>
</body></html>
