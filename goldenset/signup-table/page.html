<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>신규 회원 가입</title></head>
<body>
<form name="regForm" action="/register" method="post">
  <h2>신규 가입 정보 입력</h2>
  <table class="agree-table" summary="약관 동의">
    <tbody>
      <tr>
        <th scope="row">서비스 이용약관</th>
        <td><span class="req">필수</span></td>
        <td>
          <textarea readonly rows="4">본 이용약관은 회사와 회원 간의 서비스 이용에 관한 기본적인 사항을 정합니다. 회원가입을 위해서는 본 약관에 대한 동의가 반드시 필요합니다. 회원은 언제든지 탈퇴를 요청할 수 있습니다.</textarea>
          <input type="checkbox" name="tos" id="tos"><label for="tos">동의합니다</label>
        </td>
      </tr>
      <tr>
        <th scope="row">개인정보 수집 및 이용</th>
        <td><span class="req">필수</span></td>
        <td>
          <textarea readonly rows="4">수집항목: 이름, 생년월일, 휴대전화번호. 수집목적: 회원 식별 및 서비스 제공. 보유기간: 회원 탈퇴 후 5일 이내 파기. 본 항목에 동의하지 않으면 회원 가입이 제한됩니다.</textarea>
          <input type="checkbox" name="privacy" id="privacy"><label for="privacy">동의합니다</label>
        </td>
      </tr>
      <tr>
        <th scope="row">제3자 정보 제공</th>
        <td><span class="opt">선택</span></td>
        <td>
          <textarea readonly rows="4">회사는 제휴 보험사 및 광고 대행사에 회원의 이름과 휴대전화번호를 제공할 수 있습니다. 제공을 거부하셔도 서비스 이용에는 영향이 없습니다.</textarea>
          <input type="checkbox" name="third" id="third" checked><label for="third">동의합니다</label>
        </td>
      </tr>
    </tbody>
  </table>
  <input type="submit" value="가입 완료">
</form>
</body></html>
