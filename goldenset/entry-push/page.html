<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>이벤트 참여</title></head>
<body>
<div class="wrap">
  <h1>출석 체크 이벤트</h1>
  <p>매일 참여하기 버튼을 누르면 추첨 응모권이 쌓입니다.</p>
  <div class="agree">
    <div class="line">
      <input type="checkbox" id="g1"><label for="g1">이벤트 참여 및 개인정보 수집 동의</label><span class="m">필수</span>
      <div class="txt">응모권 지급과 당첨자 확인을 위하여 회원 식별자와 참여 기록을 수집합니다. 동의하지 않으면 이벤트에 참여할 수 없습니다.</div>
    </div>
    <div class="line">
      <input type="checkbox" id="g2" checked><label for="g2">앱 푸시 광고 수신 동의</label><span class="m">선택</span>
      <div class="txt">당첨 결과 외에 신규 이벤트와 할인 광고를 앱 푸시로 보내드립니다. 동의를 철회해도 응모권은 유지됩니다.</div>
    </div>
  </div>
  <button type="button">참여하기</button>
</div>
</body></html>
