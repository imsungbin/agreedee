<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Checkout</title></head>
<body>
<main>
  <h1>Checkout</h1>
  <p>Order total: $48.00</p>
  <form>
    <label for="card">Card number</label>
    <input type="text" id="card">
    <div class="row">
      <label><input type="checkbox" id="offers" checked> Email me exclusive offers and discounts</label>
      <p class="terms">We will send you promotional email about sales, new arrivals and discount codes for this store.</p>
    </div>
    <button type="submit">Pay now</button>
  </form>
</main>
</body>
</html>
