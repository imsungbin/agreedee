<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>가입</title></head>
<body>
<div id="app">
  <h2>회원가입</h2>
  <div class="field">아이디 <input type="text" name="id"></div>
  <div class="field">비밀번호 확인 <input type="password" name="pw2"></div>
  <div class="agreements">
    <div class="agreement">
      <input type="checkbox" id="a1" checked>
      <label for="a1">이용약관에 동의합니다</label>
      <div class="detail">회사가 제공하는 서비스의 이용 조건과 절차를 정한 약관입니다. 서비스를 이용하려면 본 약관에 대한 동의가 필요합니다.</div>
    </div>
    <div class="agreement">
      <input type="checkbox" id="a2" checked>
      <label for="a2">개인정보 처리방침에 동의합니다</label>
      <div class="detail">이름, 이메일, 접속 기록을 수집하여 회원 관리와 서비스 제공에 사용합니다. 보유 기간은 탈퇴 시까지입니다.</div>
    </div>
    <div class="agreement">
      <input type="checkbox" id="a3" checked>
      <label for="a3">이벤트 및 혜택 알림 수신에 동의합니다</label>
      <div class="detail">할인 쿠폰과 프로모션 소식을 문자와 이메일로 보내드립니다. 언제든지 수신을 해지할 수 있습니다.</div>
    </div>
  </div>
  <button type="button">가입하기</button>
</div>
</body></html>
