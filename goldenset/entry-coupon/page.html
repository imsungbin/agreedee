<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>쿠폰 받기</title></head>
<body>
<section class="coupon">
  <h1>신규 쿠폰 응모</h1>
  <p>아래 항목에 모두 동의하시면 쿠폰이 즉시 발급됩니다.</p>
  <div class="agree-wrap">
    <label class="all"><input type="checkbox" id="ca" checked> 아래 약관에 모두 동의합니다</label>
    <ul>
      <li><label><input type="checkbox" checked> 광고성 정보 수신 동의</label><i>선택</i>
        <p>쿠폰과 할인 소식을 문자, 이메일, 앱 푸시로 보내드립니다. 거부하셔도 쿠폰은 발급됩니다.</p></li>
      <li><label><input type="checkbox" checked> 개인정보 제3자 제공 동의</label><i>선택</i>
        <p>제휴 브랜드에 이름과 연락처를 제공하여 브랜드별 쿠폰을 안내합니다. 제공에 동의하지 않아도 됩니다.</p></li>
      <li><label><input type="checkbox" checked> 개인정보 처리 위탁 동의</label><i>선택</i>
        <p>쿠폰 발송 업무를 외부 문자 발송 대행사에 위탁합니다. 위탁 동의는 선택 항목입니다.</p></li>
    </ul>
  </div>
  <button type="button">쿠폰 받기</button>
</section>
</body></html>
