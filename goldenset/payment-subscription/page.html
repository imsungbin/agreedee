<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>정기결제 신청</title></head>
<body>
<div class="subscribe">
  <h1>정기결제 신청</h1>
  <div class="summary">매월 청구 예정 금액 <b>0,000원</b> · 결제수단 신용카드</div>
  <div class="agreements">
    <p class="lead">아래 내용을 확인하고 결제하기를 눌러주세요.</p>
    <div class="row"><label><input type="checkbox" checked> 정기결제 이용약관에 동의합니다</label>
      <div class="d">매월 지정일에 등록된 결제수단으로 자동 청구됩니다. 해지 전까지 결제가 계속됩니다.</div></div>
    <div class="row"><label><input type="checkbox" checked> 결제 정보 저장에 동의합니다</label>
      <div class="d">자동 청구를 위하여 카드 정보를 암호화하여 보관합니다. 해지 시 즉시 삭제합니다.</div></div>
    <div class="row"><label><input type="checkbox" checked> 구독 혜택 및 광고 수신에 동의합니다</label>
      <div class="d">구독자 전용 할인과 신규 콘텐츠 소식을 이메일로 보내드립니다.</div></div>
  </div>
  <button type="button">결제하기</button>
</div>
</body></html>
